<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Panel · Expansión</title>
  <!-- Accesos rápidos para Laura: no aparece en Google -->
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#1a0b2e" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .panel { display: grid; align-content: center; justify-items: center; gap: 2rem; min-height: 100vh; min-height: 100svh; padding: 2rem 1.25rem; text-align: center; }
    .panel h1 { margin: 0; }
    .panel__accesos { display: grid; gap: 1.5rem; width: 100%; max-width: 22rem; }
    .panel__accesos .btn { display: block; width: 100%; border: 0; font: inherit; font-size: 1.1rem; cursor: pointer; text-align: center; }
    .panel__accesos .btn--ghost { border: 1px solid var(--gold); background: transparent; box-shadow: none; }
    .panel__accesos .btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
    .panel__accesos p { margin: 0.6rem 0 0; color: var(--text-muted); font-size: 0.95rem; }
  </style>
</head>
<body>
  <main class="panel">
    <h1>Alumnos <em>Expansión</em></h1>
    <div class="panel__accesos">
      <div>
        <button type="button" class="btn" data-copiar>Copiar link de admisión</button>
        <p role="status" data-nota>Envíalo a cada alumno nuevo.</p>
      </div>
      <div>
        <a class="btn btn--ghost" href="/alumnos">Links de alumnos</a>
        <p>Mira quién ya lo completó y envíale su página.</p>
      </div>
    </div>
  </main>

  <script>
    document.querySelector("[data-copiar]").addEventListener("click", async () => {
      const link = `${location.origin}/admision`;
      const nota = document.querySelector("[data-nota]");
      try {
        await navigator.clipboard.writeText(link);
        nota.textContent = "Link copiado ✓ Ya puedes pegarlo en WhatsApp.";
      } catch {
        nota.textContent = link;
      }
    });
  </script>
</body>
</html>
